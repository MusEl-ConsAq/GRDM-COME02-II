<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Note del relatore — Composizione Elettroacustica II</title>
  <!-- Note sul telefono quando il computer della sala ha un solo schermo (o
       proietta in duplicato) e il popup di reveal (tasto S) finirebbe in sala.
       Le note si leggono da index.html, che resta la fonte. Nessuna
       sincronizzazione: avanti e indietro a mano con i pulsanti
       (niente swipe: scorrendo il testo cambiava slide per sbaglio), la slide corrente resta in
       memoria nel telefono. -->
  <style>
    :root { --bg: #111; --fg: #eee; --dim: #888; --btn: #2a2a2a; --acc: #e33; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
                 font-family: -apple-system, "Source Sans Pro", Helvetica, Arial, sans-serif; }
    body { display: flex; flex-direction: column; height: 100dvh; }
    header { display: flex; align-items: baseline; gap: 12px; padding: 12px 16px 6px; }
    #num { font-size: 15px; color: var(--dim); white-space: nowrap; }
    #title { font-size: 20px; font-weight: 700; flex: 1; }
    #timer { font-variant-numeric: tabular-nums; font-size: 20px; background: none; border: 0;
             color: var(--fg); padding: 0; }
    #timer.run { color: var(--acc); }
    main { flex: 1; overflow-y: auto; padding: 4px 16px 12px; font-size: 21px; line-height: 1.45; }
    main p { margin: 0 0 0.6em; }
    #next { padding: 6px 16px; font-size: 15px; color: var(--dim); border-top: 1px solid #333; }
    nav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; padding: 10px 16px 16px; }
    nav button { font-size: 22px; padding: 18px 0; border: 0; border-radius: 10px;
                 background: var(--btn); color: var(--fg); }
    nav button:active { background: #444; }
    nav button:disabled { opacity: .35; }
  </style>
</head>
<body>
  <header>
    <span id="num"></span><span id="title">caricamento…</span>
    <button id="timer" title="tocca: avvia/ferma · tieni premuto: azzera">00:00</button>
  </header>
  <main id="notes"></main>
  <div id="next"></div>
  <nav><button id="prev">‹</button><button id="fwd">›</button></nav>
<script>
  const $ = id => document.getElementById(id);
  const store = {   // memoria per telefono: può mancare (navigazione privata)
    get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  let slides = [], cur = 0;

  function show(i) {
    cur = Math.max(0, Math.min(slides.length - 1, i));
    const s = slides[cur], n = slides[cur + 1];
    $('num').textContent = `${cur + 1}/${slides.length}`;
    $('title').textContent = s.title;
    $('notes').innerHTML = '';
    // una frase per riga: si ritrova il punto a colpo d'occhio
    (s.notes.match(/[^.!?]+[.!?]*/g) || ['(nessuna nota)']).forEach(t => {
      $('notes').append(Object.assign(document.createElement('p'), { textContent: t.trim() }));
    });
    $('notes').scrollTop = 0;
    $('next').textContent = n ? `dopo: ${n.title}` : 'ultima slide';
    $('prev').disabled = cur === 0;
    $('fwd').disabled = cur === slides.length - 1;
    store.set('tesina-notes-slide', cur);
    history.replaceState(null, '', '#' + (cur + 1));
  }

  fetch('index.html').then(r => r.text()).then(src => {
    const doc = new DOMParser().parseFromString(src, 'text/html');
    slides = [...doc.querySelectorAll('.slides > section')].map(sec => ({
      title: (sec.querySelector('h2, h3') || {}).textContent || '',
      notes: ((sec.querySelector('aside.notes') || {}).textContent || '').replace(/\s+/g, ' ').trim(),
    }));
    const fromHash = parseInt(location.hash.slice(1), 10);
    show(fromHash ? fromHash - 1 : Number(store.get('tesina-notes-slide')) || 0);
  }).catch(() => { $('title').textContent = 'index.html non raggiungibile'; });

  $('prev').onclick = () => show(cur - 1);
  $('fwd').onclick = () => show(cur + 1);
  document.addEventListener('keydown', e => {
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) show(cur + 1);
    if (['ArrowLeft', 'PageUp'].includes(e.key)) show(cur - 1);
  });
  // timer: tocco avvia/ferma, pressione lunga azzera
  let t0 = null, acc = 0, hold;
  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  setInterval(() => {
    const s = Math.floor((acc + (t0 ? Date.now() - t0 : 0)) / 1000);
    $('timer').textContent = fmt(s);
  }, 250);
  $('timer').addEventListener('pointerdown', () => { hold = setTimeout(() => { acc = 0; t0 = null; hold = 'reset'; }, 700); });
  $('timer').addEventListener('pointerup', () => {
    if (hold === 'reset') { hold = null; $('timer').classList.remove('run'); return; }
    clearTimeout(hold);
    if (t0) { acc += Date.now() - t0; t0 = null; } else t0 = Date.now();
    $('timer').classList.toggle('run', !!t0);
  });

  // lo schermo del telefono non si spegne mentre si parla (dove supportato)
  const wake = () => navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {});
  wake();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
</script>
</body>
</html>
