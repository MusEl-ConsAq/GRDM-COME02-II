# grain_height -- grani radi e lunghi, per vedere la geometria del grano nella MAP.
# Il pitch scende di un'ottava e poi sale di un'ottava sopra la partenza: la porzione di
# buffer che ogni grano percorre cambia, la sua durata no. La stessa realizzazione
# si disegna in tre modi (esempi/render.py): altezza = durata, altezza = porzione
# letta, stampa in bianco e nero.
composition:
  title: "grain_height"

streams:
  - stream_id: altezza
    sample: voice.wav
    duration: 9.0
    time_mode: normalized
    density: 2.5
    grain:
      duration: 0.4
    pointer:
      loop_unit: normalized
      start: 0.25
      speed_ratio: 0.0
    pitch:
      semitones: {type: step, points: [[0, 0], [0.34, -12], [0.67, 12]]}

seed: 2026
