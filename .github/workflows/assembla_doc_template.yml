name: Build Tesina PDF

on:
  push:
    branches: [ main ]
    paths:
      - '**/**'
  # Le PR compilano il PDF (e lo allegano come artifact) senza pubblicarlo:
  # e' la prova che la build funziona prima del merge.
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dmgiulioromano/pandoc-latex-docker-ubuntu:2026.1-small

    steps:
    - name: Install all dependencies in one step
      run: |
        apt-get update
        apt-get install -y git python3-yaml fonts-liberation
        tlmgr update --self
        tlmgr install framed fvextra
        # pandoc e pandoc-crossref sono gia' nell'immagine
        # (pandoc-latex-docker-ubuntu = latex-docker-ubuntu + pandoc + pandoc-crossref)
        pandoc --version
        pandoc-crossref --version
        fc-cache -f -v
     
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Read font from config.yaml
      id: read_font
      run: |
        FONT=$(python3 .github/scripts/get_font.py)
        echo "FONT=$FONT" >> $GITHUB_ENV

    - name: Install Microsoft Core Fonts (including Arial)
      if: env.FONT == 'arial'
      run: |
        apt-get update
        # Accetta automaticamente la licenza EULA dei Microsoft fonts
        echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | debconf-set-selections
        apt-get install -y ttf-mscorefonts-installer fontconfig
        # Aggiorna la cache dei font per renderli disponibili subito
        fc-cache -f

    - name: Extract metadata & concatenate markdown
      run: |
        rm -f README.md *.pdf        
        python3 .github/scripts/build-tesina.py

    - name: Generate config_fonts.tex
      id: generate_font
      run: |
        # Esegui lo script Python che legge config.yaml e genera config_fonts.tex
        python3 .github/scripts/tmpTeXFont.py

    - name: Build PDF with Pandoc
      run: |
        TITLE=$(grep '^title:' metadata.yaml | cut -d':' -f2- | sed 's/^[[:space:]]*//; s/[[:space:]]*$//; s/[*]//g')
        SAFE_TITLE=$(echo "$TITLE" | tr ' ' '_' | tr -cd '[:alnum:]_')
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        PDF_NAME="${SAFE_TITLE}-CONSAQ-${TIMESTAMP}.pdf"
        pandoc --defaults styles/defaults.yml README.md -o "$PDF_NAME"
        echo "PDF_NAME=$PDF_NAME" >> $GITHUB_ENV
        mkdir -p pages_artifact
        cp "${PDF_NAME}" pages_artifact/latest.pdf
        
    - uses: actions/upload-artifact@v4
      with:
        name: "${{ env.PDF_NAME }}"
        path: "${{ env.PDF_NAME }}"
        overwrite: true
 
    - name: Upload artifact per Pages
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v4
      with:
        path: pages_artifact


    - name: Commit del documento assemblato
      if: github.ref == 'refs/heads/main'
      run: |
        cd "$GITHUB_WORKSPACE"
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        rm -f *.pdf
        git add -u
        git add README.md
        git diff --staged --quiet || git commit -m "Auto-aggiornamento documento con template [skip ci]"
        
    - name: Push delle modifiche
      if: github.ref == 'refs/heads/main'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref_name }}
        
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
